name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        run: pnpm build

      - name: Guided run smoke
        run: pnpm guided-run-smoke

      - name: Provider adapter contract smoke
        run: pnpm provider-adapter-smoke

      - name: MCP policy contract smoke
        run: pnpm mcp-policy-smoke

      - name: MCP proxy integration smoke
        run: pnpm mcp-proxy-smoke

      - name: API adapter contract smoke
        run: pnpm api-adapter-smoke

      - name: UI quality and native contract smoke
        run: |
          pnpm ui-quality-smoke
          pnpm native-contract-smoke

      - name: Enforce frontend performance budget
        run: pnpm performance-budget

      - name: Verify a deterministic EvidencePack
        run: |
          pnpm controlled-smoke
          pnpm dbc:verify -- --latest

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
